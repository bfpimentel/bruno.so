<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bfmp.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bruno Pimentel</title>
    <link
      rel="preload"
      href="/fonts/Iosevka/iosevka-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Iosevka/iosevka-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem("bruno-so-theme")
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      })()
    </script>
    <!--head-tags-->
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
