name: Update profile
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Generate profile
        run: bun generate_profile.ts
      - name: Commit and deploy if changed
        run: |
          if git diff --quiet src/data/profile.json; then
            echo "Profile unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile" src/data/profile.json
          git push
          gh workflow run deploy.yaml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep schedule alive
        run: gh workflow enable update-profile.yaml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
